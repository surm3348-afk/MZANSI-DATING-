name: mzansi_dating
description: "Find Love E Mzansi - Classy South African Dating & Companion App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core & Firestore
  firebase_core: ^3.10.1
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.4.4
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.4

  # UI, Fonts & Icons
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  cupertino_icons: ^1.0.8

  # State & Utilities
  intl: ^0.19.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
